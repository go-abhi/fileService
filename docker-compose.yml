# Local stack: the file service backed by MinIO (S3-compatible).
#
#   docker compose up --build
#
#   REST + gRPC: http://localhost:8080   gRPC: localhost:9090
#   MinIO console: http://localhost:9001 (minioadmin / minioadmin)
#   API key: dev-api-key-change-me (namespace "demo")
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  fileservice:
    build: .
    depends_on:
      - minio
    environment:
      FILESERVICE_S3_BUCKET: files
      FILESERVICE_S3_CREATE_BUCKET: "true"
      FILESERVICE_S3_ENDPOINT: http://minio:9000
      # Presigned URLs must point at an address your browser / client can reach.
      FILESERVICE_S3_PUBLIC_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      FILESERVICE_API_KEYS: demo:dev-api-key-change-me
      FILESERVICE_CORS_ORIGINS: "*"
      FILESERVICE_LOG_FORMAT: text
    ports:
      - "8080:8080"
      - "9090:9090"

volumes:
  minio-data:
